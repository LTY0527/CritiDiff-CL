[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "critidiff-cl"
version = "1.0.0"
description = "Artifact code for fault-semantic frequency-selective diffusion and domain-calibrated contrastive learning"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "torch>=2.2",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
data = ["pyreadr>=0.5"]
test = ["pytest>=7"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["utils"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"

